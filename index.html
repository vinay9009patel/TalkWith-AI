<!DOCTYPE html>
<html lang="en">

<title>Character World</title>

<style>
html { scroll-behavior: smooth; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --font-main: 'Inter', sans-serif;
  --font-sexy: 'Playfair Display', serif;
  --bg: #050505;
  --surface: #0f0f12;
  --card: #16161a;
  --border: rgba(124,58,237,0.1);
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --primary: #8b5cf6;
  --primary-light: #c4b5fd;
  --accent: #d946ef;
  --success: #10b981;
  --danger: #ef4444;
  --wa-bg: #08080a;
  --wa-user: #f472b6;
  --wa-other: #1e1e24;
  --wa-header: #121217;
  --plot-bg: rgba(245, 158, 11, 0.1);
  --plot-text: #fef3c7;
  --plot-accent: #f59e0b;
}
body {
  font-family: var(--font-main);
  background: var(--bg);
  color: var(--text);
  background-image: radial-gradient(circle at 50% -20%, #1e1b4b 0%, transparent 50%);
}
a { color: inherit; text-decoration: none; }

.app { display: flex; min-height: 100vh; }

.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 220px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 24px 0;
  display: flex; flex-direction: column; z-index: 40;
}
.sidebar .logo {
  padding: 8px 24px 24px; font-size: 20px; font-weight: 900;
  color: var(--primary-light);
  letter-spacing: -1px;
}
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 24px; cursor: pointer;
  color: var(--text-muted); font-weight: 500; font-size: 14px;
  transition: all 0.2s; border-right: 2px solid transparent;
}
.nav-item:hover { background: rgba(124,58,237,0.05); color: var(--text); }
.nav-item.active {
  background: rgba(124,58,237,0.12);
  color: var(--primary-light);
  border-right-color: var(--primary);
}

.main { margin-left: 220px; min-height: 100vh; height: 100vh; padding: 24px 32px 100px; display: flex; flex-direction: column; overflow: hidden; }
.main.chat-open { padding-bottom: 0; }

/* Page Transitions */
.page { 
  display: none; 
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  height: 100%; 
  overflow: hidden; 
}
.page.active { 
  display: block; 
  opacity: 1;
  transform: translateY(0);
}
#chat.page.active { display: flex; flex-direction: column; min-height: 0; height: 100%; }

.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
}

.ai-talk-card {
  background: linear-gradient(135deg, rgba(124, 58, 237, 0.15), rgba(217, 70, 239, 0.15));
  border: 2px solid rgba(124, 58, 237, 0.2);
  border-radius: 24px;
  padding: 32px;
  display: flex;
  align-items: center;
  gap: 24px;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  position: relative;
  overflow: hidden;
  margin-bottom: 24px;
}
.ai-talk-card:hover {
  transform: translateY(-5px);
  border-color: rgba(124, 58, 237, 0.4);
  box-shadow: 0 20px 40px -10px rgba(124, 58, 237, 0.3);
  background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(217, 70, 239, 0.2));
}
.ai-talk-card .icon-box {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, #7c3aed, #d946ef);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
}
.ai-talk-card .content { flex: 1; }
.ai-talk-card h2 { font-size: 24px; font-weight: 900; margin-bottom: 4px; color: var(--text); }
.ai-talk-card p { color: var(--text-muted); font-size: 15px; }
.ai-talk-card .arrow {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.05);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}
.ai-talk-card:hover .arrow {
  background: var(--primary);
  color: white;
  transform: translateX(5px);
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 32px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar h1 { font-size: 22px; font-weight: 700; }
.topbar h1 span { color: var(--primary-light); }
.topbar p { color: var(--text-muted); margin-top: 2px; font-size: 14px; }

.btn {
  padding: 10px 20px; border-radius: 12px; border: none; cursor: pointer;
  font-weight: 600; font-size: 14px; transition: all 0.2s;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn.primary {
  background: linear-gradient(135deg, var(--primary), #6d28d9);
  color: white;
  box-shadow: 0 4px 15px rgba(124,58,237,0.3);
}
.btn.primary:hover { background: linear-gradient(135deg, #7c3aed, #5b21b6); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,58,237,0.4); }
.btn.dark { background: #1f2937; color: var(--text); }
.btn.dark:hover { background: #252f3f; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 24px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 4px 20px -5px rgba(0,0,0,0.5);
}
.card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(124,58,237,0.25); border-color: rgba(124,58,237,0.3); }
.card h2 { color: var(--text); font-weight: 700; font-size: 20px; }
.card p { color: var(--text-muted); }

.input {
  width: 100%; padding: 12px 16px; border-radius: 10px; border: none;
  background: #1f1f1f; color: var(--text); font-size: 14px;
  outline: none; transition: all 0.2s; margin-bottom: 16px;
}
.input::placeholder { color: var(--text-muted); }
.input:focus { background: #252525; box-shadow: 0 0 0 2px rgba(124,58,237,0.3); border-color: var(--primary); }

.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px; margin-bottom: 24px;
}
.stats .card { padding: 20px; }
.stat-title { color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
.stat-value { color: var(--text); font-size: 28px; font-weight: 700; }

.auth-box {
  max-width: 400px; margin: 40px auto; padding: 40px 32px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; text-align: center;
}
.auth-title { font-size: 32px; font-weight: 800; color: var(--primary-light); margin-bottom: 8px; }
.auth-sub { color: var(--text-muted); margin-bottom: 28px; font-size: 14px; }

#authScreen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100dvh; background: var(--bg); padding: 20px;
}

.bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 6px 0; justify-content: space-around; z-index: 50;
}
.bottom-nav button {
  background: none; border: none; color: var(--text-muted); font-size: 20px;
  padding: 8px 14px; cursor: pointer; border-radius: 10px; transition: all 0.2s;
}
.bottom-nav button.active { color: var(--primary-light); background: rgba(124,58,237,0.08); }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .app { flex-direction: column; min-height: 100dvh; }
  .main { margin-left: 0; padding: 12px 10px 80px; min-height: 100dvh; display: flex; flex-direction: column; overflow-x: hidden; }

  .ai-talk-card { padding: 20px; gap: 16px; border-radius: 20px; margin-bottom: 20px; }
  .ai-talk-card .icon-box { width: 52px; height: 52px; border-radius: 14px; }
  .ai-talk-card h2 { font-size: 18px; }
  .ai-talk-card p { font-size: 13px; }
  .ai-talk-card .arrow { width: 32px; height: 32px; }

  .auth-box { padding: 32px 20px; margin: 20px 10px; max-width: none; }
  .auth-box h1 { font-size: 28px; }
  .auth-box .input { font-size: 15px; padding: 12px 14px; }

  .bottom-nav { display: flex; box-shadow: 0 -5px 20px rgba(0,0,0,0.3); }
  .bottom-nav button { font-size: 22px; padding: 8px 12px; }
  
  .main.chat-open { 
    padding: 0; position: fixed; inset: 0; height: 100dvh; z-index: 100;
  }
  .main.chat-open .chat-messages { padding: 6px; gap: 4px; }
  .main.chat-open .chat-input-area { padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
}

.loader {
  width: 32px; height: 32px; border: 3px solid rgba(124,58,237,0.1);
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* === CHAT SETUP (Character World) === */
.chat-setup {
  text-align: center; padding: 40px 24px;
  display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; flex: 1;
  overflow-y: auto; height: 100%; width: 100%;
  animation: setupIn 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}
@keyframes setupIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.setup-section {
  width: 100%;
  max-width: 1200px;
  margin-bottom: 32px;
  text-align: left;
  background: rgba(255,255,255,0.02);
  padding: 60px;
  border-radius: 40px;
  border: 1px solid var(--border);
  box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3);
}

.chat-setup .ai-avatar {
  width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 20px;
  object-fit: cover; border: 4px solid rgba(124,58,237,0.2);
  box-shadow: 0 0 40px rgba(124,58,237,0.15);
}

/* === CHAT UI === */
.chat-container { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.chat-messages {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--wa-bg);
  background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 0);
  background-size: 24px 24px;
}

.msg { display: flex; gap: 10px; max-width: 80%; animation: msgIn 0.3s ease-out; }
@keyframes msgIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.msg.ai { align-self: flex-start; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }

.msg-bubble {
  padding: 12px 18px; border-radius: 20px; line-height: 1.6;
  background: var(--wa-other); color: var(--text);
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}
.msg.user .msg-bubble {
  background: linear-gradient(135deg, #f472b6, #d946ef);
  color: white; font-weight: 600;
}

.msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; align-self: flex-end; }

.msg-action {
  display: block; margin-bottom: 6px;
  color: #c4b5fd; font-style: italic; font-size: 14.5px;
  text-shadow: 0 0 8px rgba(139, 92, 246, 0.4);
}

/* Achievements Grid */
.badges-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 16px; margin-top: 10px;
}
.badge-card {
  background: rgba(124, 58, 237, 0.05); border: 1px solid rgba(124, 58, 237, 0.15);
  border-radius: 20px; padding: 20px 10px; text-align: center;
  transition: all 0.3s;
}
.badge-icon { font-size: 32px; margin-bottom: 12px; }
.badge-name { font-size: 13px; font-weight: 800; color: var(--primary-light); text-transform: uppercase; }
.badge-desc { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

</style>
</head>
<body>

<!-- AUTH -->
<div id="authScreen">
<div class="auth-box">
<h1 class="auth-title">AI Talk</h1>
<p class="auth-sub">Chat with AI — your way</p>
<input type="email" id="email" class="input" placeholder="Email">
<input type="password" id="password" class="input" placeholder="Password">
<button class="btn primary" style="width:100%;" onclick="login()">Login</button>
<div id="authStatus" style="display:none; margin-top:10px;"></div>
</div>
</div>

<!-- APP -->
<div class="app" style="display:none;">
<div class="sidebar">
<div class="logo">AI Talk</div>
<div class="nav-item active" onclick="showPage('dashboard',this)">Dashboard</div>
<div class="nav-item" onclick="showPage('chat',this)">AI Talk</div>
</div>

<div class="main">
<div id="dashboard" class="page active">
  <div class="ai-talk-card" onclick="showPage('chat',document.querySelectorAll('.nav-item')[1])">
    <div class="icon-box">💬</div>
    <div class="content"><h2>Start AI Talk</h2><p>Step into immersive roleplay.</p></div>
    <div class="arrow">→</div>
  </div>
  <div class="card"><h2>Achievements</h2><div id="badgesContainer"></div></div>
</div>

<div id="chat" class="page">
  <div id="chatSetup" class="chat-setup">
    <div class="setup-section">
      <img class="ai-avatar" id="chatAvatarSetup" src="https://ui-avatars.com/api/?name=?">
      <h2>Character World</h2>
      <p>Configure your mission.</p>
      <input type="text" id="chatRole" class="input" placeholder="Role">
      <textarea id="chatBio" class="input" placeholder="Context"></textarea>
      <button class="btn primary" onclick="startChat()">Enter World</button>
    </div>
  </div>
  <div id="chatScreen" class="chat-screen" style="display:none;">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <textarea id="chatInput" class="chat-input" placeholder="Type a message..."></textarea>
      <button class="btn primary" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>
</div>
</div>

<script>
// === CONFIG ===
const WORKER_URL = "https://ai-talk.vinaypatel975562.workers.dev";
const ADMIN_EMAIL = "vinay9009patel@gmail.com";

// === STATE ===
let appData = { xp: 0, chatsDone: 0, totalMessages: 0, streak: 0, usedRoleIds: [], badges: [] };
let chatHistory = [];
let chatRole = "", chatBio = "", chatActive = false, isAiThinking = false;
let sessionUserName = "User", sessionAiName = "Character", chatGender = "male", userGender = "male", selectedAvatar = "";

// === UI HELPERS ===
function escapeHtml(v){ return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function getTimeStr(){ return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

function formatMessageText(value){
  let html = escapeHtml(value);
  html = html.replace(/[\(\[]\s*[MF]\s*[\)\]]\s*[-:]?/gi, ""); 
  const speakerNameRegex = /(?:^|\n)(?!(?:M|F|I|He|She|They|The|It|Note|Hint|Warning):)([a-zA-Z0-9\s]{2,25}):/gm;
  html = html.replace(speakerNameRegex, (m, name) => `<span style="color:#f472b6; font-weight:800; text-transform:uppercase; font-size:11px; display:block; margin-top:12px; margin-bottom:4px; letter-spacing:1px; border-bottom:1px solid rgba(244, 114, 182, 0.2); padding-bottom:2px;">👤 ${name.trim().replace(':','')}:</span>`);
  return html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<span class="msg-action">$1</span>').replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
}

function containsEmoji(text){
  const emojiRegex = /(\u00a9|\u00ae|[\u2000-\u3300]|\ud83c[\ud000-\udfff]|\ud83d[\ud000-\udfff]|\ud83e[\ud000-\udfff])/g;
  return emojiRegex.test(text);
}

function appendFallbackEmoji(text){
  if(containsEmoji(text)) return text;
  // Simplified for brevity in this restoration
  return text + " ✨"; 
}

// === ENGINE ===
function buildChatSystemPrompt(){
  return `You are an expert Roleplay Engine.
RULES:
1. FORMAT: Name: *action* "dialogue"
2. BREVITY: Strictly 1-2 short lines. Max 3 sentences total.
3. USER AGENCY: User input is immediately canon.
4. SIDE CHARACTERS: Introduce narratively.
5. NO USER CONTROL: Never speak for ${sessionUserName}.`;
}

async function startChat(){
  const role = document.getElementById("chatRole").value.trim();
  if(!role) return alert("Enter role");
  chatRole = role; sessionAiName = "Aria"; sessionUserName = "Vinay"; // Example
  document.getElementById("chatSetup").style.display = "none";
  document.getElementById("chatScreen").style.display = "flex";
  chatActive = true;
  addMessage("ai", "Aria: *smiles* \"Ready to begin, Vinay?\"");
}

async function sendMessage(){
  if(isAiThinking || !chatActive) return;
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if(!text) return;
  input.value = ""; addMessage("user", text);
  isAiThinking = true;
  
  const prompt = `User: ${text}\nReply as ${chatRole}.`;
  try {
    const response = await fetch(WORKER_URL + "/openai/v1/chat/completions", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ model:"llama-3.1-8b-instant", messages: [{role:"system",content:buildChatSystemPrompt()},{role:"user",content:prompt}] })
    });
    const data = await response.json();
    const reply = data.choices[0].message.content;
    const final = appendFallbackEmoji(reply);
    addMessage("ai", final);
  } catch(e) { addMessage("ai", "Connection error."); }
  isAiThinking = false;
}

function addMessage(role, text, raw = ""){
  const messages = document.getElementById("chatMessages");
  const div = document.createElement("div");
  div.className = "msg " + role;
  const avatarUrl = role === "ai" ? "https://ui-avatars.com/api/?name=A&background=1a1a1a&color=f472b6" : "";
  div.innerHTML = (role === "ai" ? `<img class="msg-avatar" src="${avatarUrl}">` : "") + `<div><div class="msg-bubble">${formatMessageText(text)}</div><div class="msg-time">${getTimeStr()}</div></div>`;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function showPage(id, el){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  if(el) el.classList.add("active");
}

function login(){
  document.getElementById("authScreen").style.display = "none";
  document.querySelector(".app").style.display = "flex";
}
</script>
</body>
</html>
